<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05070d" />
  <title>Baatcheet — Chat</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Baatcheet" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- CSS -->
  <link rel="stylesheet" href="./static/css/base.css" />
  <link rel="stylesheet" href="./static/css/sidebar.css" />
  <link rel="stylesheet" href="./static/css/chat.css" />
  <link rel="stylesheet" href="./static/css/messages.css" />
  <link rel="stylesheet" href="./static/css/composer.css" />
  <link rel="stylesheet" href="./static/css/mobile.css" />
  <link rel="stylesheet" href="./static/css/profile.css" />
  <link rel="stylesheet" href="./static/css/gifs.css" />
  <link rel="stylesheet" href="./static/css/delete.css" />

  <!-- Eruda -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</head>
<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-header">
        <div class="brand">
          <img src="./static/assets/logo.png" alt="T-Rex Blue" class="brand-logo" onerror="this.style.display='none'" />
          <div class="brand-text">
            <h1>Baatcheet</h1>
            <span class="brand-sub">by T-Rex Blue</span>
          </div>
        </div>
        <input type="text" id="search" placeholder="Search users..." autocomplete="off" />
      </header>

      <ul class="chat-list" id="chatList"></ul>

      <footer class="sidebar-footer">
        <button id="myProfileBtn" class="my-profile-btn" title="My Profile">
          <div class="avatar" id="myAvatar">?</div>
          <div class="my-info">
            <span id="meLabel">Guest</span>
            <small>View Profile</small>
          </div>
        </button>
        <button id="logoutBtn" title="Logout" class="logout-btn">Logout</button>
      </footer>
    </aside>

    <!-- CHAT -->
    <main class="chat" id="chatWindow">

      <header class="chat-header" id="normalHeader">
        <button class="back-btn" id="backBtn" aria-label="Back">←</button>
        <div class="avatar" id="headerAvatar"></div>
        <div class="chat-info">
          <h2 id="headerName">Select a chat</h2>
          <span id="headerStatus" class="status">offline</span>
        </div>
      </header>

      <div class="select-banner" id="selectBanner">
        <button class="select-cancel" id="selectCancelBtn" aria-label="Cancel">✕</button>
        <span class="select-count" id="selectCount">0 selected</span>
        <button class="select-delete" id="selectDeleteBtn" disabled>Delete</button>
      </div>

      <div class="messages" id="messages">
        <div class="empty-state">
          <div class="empty-glow"></div>
          <p>Pick a conversation to start</p>
        </div>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="composer-icon-btn" id="photoBtn" title="Photo">
          <span class="icon-photo">📷</span>
        </button>
        <button type="button" class="composer-icon-btn" id="gifBtn" title="GIF">
          <span class="icon-gif">GIF</span>
        </button>
        <button type="button" class="composer-icon-btn" id="trashBtn" title="Select & Delete">
          <span class="icon-trash">🗑</span>
        </button>
        <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" maxlength="1000" />
        <button type="submit" id="sendBtn"><span>Send</span></button>
        <input type="file" id="photoInput" accept="image/*" hidden />
      </form>
    </main>

  </div>

  <!-- GIF PANEL -->
  <div class="gif-panel" id="gifPanel">
    <div class="gif-backdrop" id="gifBackdrop"></div>
    <div class="gif-card">
      <button class="gif-close" id="gifClose" aria-label="Close">×</button>
      <div class="gif-header">
        <input type="text" id="gifSearch" placeholder="Search GIFs, memes..." autocomplete="off" />
      </div>
      <div class="gif-tabs" id="gifTabs"></div>
      <div class="gif-scroll">
        <div class="gif-grid" id="gifGrid"></div>
      </div>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div class="profile-modal" id="profileModal">
    <div class="profile-backdrop" id="modalBackdrop"></div>
    <div class="profile-card">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <div class="profile-avatar" id="modalAvatar">?</div>
      <h2 class="profile-name" id="modalName">@user</h2>
      <div class="profile-bio">
        <p class="bio-view" id="modalBioView">Koi bio nahi 😶</p>
        <textarea class="bio-edit" id="modalBioEdit" maxlength="150" placeholder="Apni bio likho..." rows="3"></textarea>
      </div>
      <div class="profile-actions">
        <button class="btn-secondary" id="modalEditBtn">Edit Bio</button>
        <button class="btn-secondary" id="modalUploadBtn">Change Photo</button>
        <button class="btn-primary" id="modalSaveBtn">Save</button>
        <input type="file" id="modalFileInput" accept="image/*" hidden />
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./static/js/supabase.js"></script>
  <script src="./static/js/storage.js"></script>
  <script src="./static/js/state.js"></script>
  <script src="./static/js/auth.js"></script>
  <script src="./static/js/avatar.js"></script>
  <script src="./static/js/photos.js"></script>
  <script src="./static/js/profile.js"></script>
  <script src="./static/js/delete.js"></script>
  <script src="./static/js/ui.js"></script>
  <script src="./static/js/users.js"></script>
  <script src="./static/js/messages.js"></script>
  <script src="./static/js/gifs.js"></script>
  <script src="./static/js/actions.js"></script>
  <script src="./static/js/main.js"></script>

  <!-- PWA — Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(reg => {
            console.log("✅ SW registered");

            // Auto-update: naya SW mile toh activate karo
            reg.addEventListener("updatefound", () => {
              const newWorker = reg.installing;
              newWorker.addEventListener("statechange", () => {
                if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                  // Naya version ready — reload
                  newWorker.postMessage("SKIP_WAITING");
                }
              });
            });
          })
          .catch(err => console.warn("SW registration failed:", err));

        // Reload page when new SW takes over
        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }
  </script>

</body>
</html>
