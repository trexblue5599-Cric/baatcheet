<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05070d" />
  <title>Baatcheet — Login</title>
  <link rel="stylesheet" href="./static/css/base.css" />
  <link rel="stylesheet" href="./static/css/auth.css" />
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</head>
<body class="auth-body">

  <div class="auth-card">

    <div class="auth-logo">
      <img src="./static/assets/logo.png" alt="T-Rex Blue" onerror="this.style.display='none'" />
    </div>

    <h1 class="auth-title">BAATCHEET</h1>
    <p class="auth-sub">by T-Rex Blue</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Login</button>
      <button class="auth-tab" data-tab="register">Register</button>
    </div>

    <form class="auth-form" id="authForm" autocomplete="off">
      <div class="auth-field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="aarav" required minlength="3" maxlength="20" autocomplete="username" />
      </div>

      <div class="auth-field password-wrap">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required minlength="4" autocomplete="current-password" />
        <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password">👁</button>
      </div>

      <div class="auth-message" id="authMessage"></div>

      <button type="submit" class="auth-submit" id="submitBtn">Login</button>
    </form>

    <p class="auth-footer">
      New here? <span id="switchLink">Create account</span>
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./static/js/supabase.js"></script>
  <script src="./static/js/storage.js"></script>
  <script src="./static/js/state.js"></script>
  <script src="./static/js/auth.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const form       = document.getElementById("authForm");
      const userEl     = document.getElementById("username");
      const passEl     = document.getElementById("password");
      const msgEl      = document.getElementById("authMessage");
      const submitBtn  = document.getElementById("submitBtn");
      const tabs       = document.querySelectorAll(".auth-tab");
      const switchLink = document.getElementById("switchLink");
      const togglePw   = document.getElementById("togglePw");

      let mode = "login";

      function setMode(m) {
        mode = m;
        tabs.forEach(t => t.classList.toggle("active", t.dataset.tab === m));
        submitBtn.textContent = m === "login" ? "Login" : "Register";
        switchLink.textContent = m === "login" ? "Create account" : "Login instead";
        msgEl.classList.remove("show", "error", "success");
        msgEl.textContent = "";
      }

      tabs.forEach(t => t.addEventListener("click", () => setMode(t.dataset.tab)));
      switchLink.addEventListener("click", () => setMode(mode === "login" ? "register" : "login"));

      togglePw.addEventListener("click", () => {
        passEl.type = passEl.type === "password" ? "text" : "password";
      });

      function showMsg(text, type = "error") {
        msgEl.textContent = text;
        msgEl.className = "auth-message show " + type;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = userEl.value.trim();
        const password = passEl.value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner"></span>Please wait...`;

        const result = mode === "login"
          ? await Auth.login(username, password)
          : await Auth.register(username, password);

        if (!result.ok) {
          showMsg(result.error, "error");
          submitBtn.disabled = false;
          submitBtn.textContent = mode === "login" ? "Login" : "Register";
          return;
        }

        Storage.saveSession({
          username: result.user.user_metadata?.username || username,
          userId: result.user.id
        });

        showMsg(mode === "login" ? "Login successful! 🎉" : "Account created! 🎉", "success");

        setTimeout(() => {
          location.href = "./chat.html";
        }, 700);
      });

      const session = await Auth.getSession();
      if (session) location.href = "./chat.html";
    });
  </script>

</body>
</html>
